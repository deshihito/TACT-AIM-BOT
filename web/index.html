<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TACT-AIM リアルタイム観戦</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1117; overflow: hidden; }
  #view { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; top: 10px; left: 12px; color: #e2e8f0;
    font: 14px/1.5 system-ui, sans-serif; pointer-events: none;
    text-shadow: 0 1px 3px #000;
    background: rgba(13, 17, 23, .55); padding: 6px 10px; border-radius: 8px;
  }
  #hud .sub { color: #94a3b8; font-size: 12px; }
  #players {
    position: fixed; top: 10px; right: 12px; display: flex;
    flex-direction: column; gap: 6px; max-height: calc(100vh - 20px);
    overflow-y: auto; font: 13px/1.4 system-ui, sans-serif;
  }
  #players .chip {
    background: rgba(13, 17, 23, .55); color: #e2e8f0;
    border: 1px solid rgba(255, 255, 255, .18); border-radius: 999px;
    padding: 5px 12px; font: inherit; text-align: left;
    white-space: nowrap; cursor: pointer;
  }
  #players .chip.active {
    background: #2563eb; border-color: #2563eb; color: #ffffff;
  }
  #followbar {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: none; align-items: center; gap: 10px;
    background: rgba(13, 17, 23, .55); color: #e2e8f0;
    padding: 6px 8px 6px 14px; border-radius: 999px;
    font: 14px/1.5 system-ui, sans-serif;
  }
  #followbar button {
    background: #2563eb; color: #ffffff; border: none; border-radius: 999px;
    padding: 5px 12px; font: inherit; cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <div><b id="title">TACT-AIM</b> <span id="count"></span></div>
  <div class="sub" id="state">接続中…</div>
</div>
<div id="players"></div>
<div id="followbar"><span id="followname"></span><button id="followexit" type="button">全体表示</button></div>
<script type="module" src="app.js"></script>
</body>
</html>
